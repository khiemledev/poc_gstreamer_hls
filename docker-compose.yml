services:
  backend:
    build: ./backend
    container_name: hls-gstreamer-backend
    # network_mode: host
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - hls_data:/app/hls
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: hls-gstreamer-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: hls-gstreamer-nginx
    ports:
      - "8081:8081"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - hls_data:/usr/share/nginx/html/hls:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hls_data:
